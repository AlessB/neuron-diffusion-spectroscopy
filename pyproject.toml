[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nds"
version = "0.1.0"
description = "Neuron diffusion spectroscopy of LLM pretraining (Pythia checkpoints)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# PyTorch is NOT listed here on purpose: install it first, from the PyTorch index that matches
# your GPU (a GTX 10-series card needs the cu126 build; newer CUDA builds dropped it), then
# `pip install -e ".[model]"`.
model = [
    "transformers>=4.40",
    "datasets>=2.18",
    "huggingface_hub>=0.22",
]
analysis = [
    "matplotlib>=3.7",
    "ruptures>=1.1",
    "pandas>=2.0",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
